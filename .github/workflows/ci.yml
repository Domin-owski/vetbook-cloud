name: VetBook Cloud CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan secrets with Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            dir /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --exit-code 1

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [secret-scan, vulnerability-scan]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:3000/api
        run: npm run build

      - name: Check frontend build output
        working-directory: frontend
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "PASS: frontend build contains index.html and assets"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend JavaScript syntax
        working-directory: backend
        run: |
          find src -type f -name '*.js' -print0 |
            xargs -0 -r -n 1 node --check

      - name: Test backend HTTP endpoints
        working-directory: backend
        env:
          PORT: '3000'
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/vetbook_ci
        run: |
          node src/server.js > /tmp/vetbook-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/vetbook-api.log
            exit 1
          fi

          node --input-type=module <<'JS'
          import assert from "node:assert/strict";

          const health = await fetch("http://localhost:3000/health");
          assert.equal(health.status, 200);

          const body = await health.json();
          assert.equal(body.status, "ok");
          assert.equal(body.service, "VetBook API");
          console.log("PASS: GET /health returns the expected response");

          const missing = await fetch(
            "http://localhost:3000/ci-route-that-does-not-exist"
          );
          assert.equal(missing.status, 404);

          const error = await missing.json();
          assert.equal(error.error, "Nie znaleziono endpointu");
          console.log("PASS: unknown endpoint returns 404");
          JS
