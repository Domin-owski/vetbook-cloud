<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VetBook Cloud - architektura 3-tier w Microsoft Azure</title>
  <desc id="desc">Przepływ od użytkownika przez warstwę Web React, prywatne REST API Node.js i prywatną warstwę PostgreSQL w sieci Azure VNet.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f8a70"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 21px Arial, sans-serif; fill: #526674; }
      .group-title { font: 700 22px Arial, sans-serif; fill: #17324d; letter-spacing: 0.5px; }
      .box-title { font: 700 25px Arial, sans-serif; fill: #17324d; }
      .box-text { font: 400 20px Arial, sans-serif; fill: #20303c; }
      .small { font: 400 17px Arial, sans-serif; fill: #526674; }
      .arrow-label { font: 700 16px Arial, sans-serif; fill: #1f6f5b; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="90" y="82" class="title">VetBook Cloud - architektura 3-tier w Azure</text>
  <text x="90" y="120" class="subtitle">Kalendarz i rezerwacja wizyt weterynaryjnych</text>

  <rect x="300" y="170" width="1220" height="590" rx="28" fill="#f4f7f9" stroke="#9bb0bd" stroke-width="3"/>
  <text x="340" y="215" class="group-title">MICROSOFT AZURE / VNET 10.0.0.0/16</text>

  <rect x="350" y="255" width="350" height="400" rx="22" fill="#e8f1ff" stroke="#4d7cc7" stroke-width="4" filter="url(#shadow)"/>
  <rect x="760" y="255" width="350" height="400" rx="22" fill="#e7f5f0" stroke="#1f8a70" stroke-width="4" filter="url(#shadow)"/>
  <rect x="1170" y="255" width="300" height="400" rx="22" fill="#fff0ed" stroke="#c9604e" stroke-width="4" filter="url(#shadow)"/>

  <text x="525" y="303" text-anchor="middle" class="group-title">SNET-WEB</text>
  <text x="525" y="335" text-anchor="middle" class="small">10.0.1.0/24</text>
  <line x1="390" y1="360" x2="660" y2="360" stroke="#b8cae6" stroke-width="2"/>
  <text x="525" y="410" text-anchor="middle" class="box-title">Presentation Layer</text>
  <text x="525" y="455" text-anchor="middle" class="box-text">React + Vite</text>
  <text x="525" y="492" text-anchor="middle" class="box-text">HTTPS endpoint</text>
  <text x="525" y="555" text-anchor="middle" class="small">Dostęp publiczny: TCP 443</text>
  <rect x="421" y="585" width="208" height="38" rx="19" fill="#d8e7ff"/>
  <text x="525" y="611" text-anchor="middle" class="small">NSG: nsg-web</text>

  <text x="935" y="303" text-anchor="middle" class="group-title">SNET-APP</text>
  <text x="935" y="335" text-anchor="middle" class="small">10.0.2.0/24</text>
  <line x1="800" y1="360" x2="1070" y2="360" stroke="#b7dacc" stroke-width="2"/>
  <text x="935" y="410" text-anchor="middle" class="box-title">Application Layer</text>
  <text x="935" y="455" text-anchor="middle" class="box-text">Node.js + Express</text>
  <text x="935" y="492" text-anchor="middle" class="box-text">REST API</text>
  <text x="935" y="555" text-anchor="middle" class="small">Ruch tylko z warstwy Web</text>
  <rect x="830" y="585" width="210" height="38" rx="19" fill="#d6eee5"/>
  <text x="935" y="611" text-anchor="middle" class="small">NSG: nsg-app</text>

  <text x="1320" y="303" text-anchor="middle" class="group-title">SNET-DB</text>
  <text x="1320" y="335" text-anchor="middle" class="small">10.0.3.0/24</text>
  <line x1="1205" y1="360" x2="1435" y2="360" stroke="#e5c6be" stroke-width="2"/>
  <text x="1320" y="410" text-anchor="middle" class="box-title">Data Layer</text>
  <text x="1320" y="455" text-anchor="middle" class="box-text">PostgreSQL</text>
  <text x="1320" y="492" text-anchor="middle" class="box-text">TCP 5432</text>
  <text x="1320" y="555" text-anchor="middle" class="small">Ruch tylko z warstwy App</text>
  <rect x="1217" y="585" width="206" height="38" rx="19" fill="#f7ddd7"/>
  <text x="1320" y="611" text-anchor="middle" class="small">NSG: nsg-db</text>

  <circle cx="155" cy="420" r="58" fill="#ffffff" stroke="#17324d" stroke-width="4"/>
  <circle cx="155" cy="397" r="18" fill="#17324d"/>
  <path d="M117 454 C122 423, 188 423, 193 454" fill="#17324d"/>
  <text x="155" y="515" text-anchor="middle" class="box-title">Użytkownik</text>
  <text x="155" y="546" text-anchor="middle" class="small">przeglądarka</text>

  <line x1="215" y1="420" x2="345" y2="420" stroke="#1f8a70" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="280" y="397" text-anchor="middle" class="arrow-label">HTTPS 443</text>

  <line x1="700" y1="455" x2="755" y2="455" stroke="#1f8a70" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="728" y="430" text-anchor="middle" class="arrow-label">TCP 3000</text>

  <line x1="1110" y1="455" x2="1165" y2="455" stroke="#1f8a70" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="1138" y="430" text-anchor="middle" class="arrow-label">TCP 5432</text>

  <rect x="90" y="795" width="1430" height="64" rx="14" fill="#e7f5f0"/>
  <text x="120" y="823" class="small">Przepływ: użytkownik → snet-web → snet-app → snet-db.</text>
  <text x="120" y="848" class="small">Podsieci App i DB: rt-private-no-internet, trasa 0.0.0.0/0 → None.</text>
</svg>
